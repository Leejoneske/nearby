name: Build Android APK

# Produces the APK the landing page links to.
#
#   - Run it by hand from the Actions tab to publish a build right now.
#   - Or push a tag like v1.0.1 to cut a versioned release.
#
# The asset is always named nearby.apk, which is what makes
# /releases/latest/download/nearby.apk a stable link the site can rely on.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Expo SDK 57 / React Native 0.86 builds against JDK 17.
      #
      # No `cache: gradle` here: that option looks for *.gradle files at this
      # point in the job, and android/ does not exist until expo prebuild runs
      # three steps below. It fails the whole job in twenty seconds. The cache
      # is handled separately, keyed on the lockfile that decides what the
      # generated project will contain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # The version in app.json is the human one and changes by hand. The
      # version code is a counter Android compares to decide whether an
      # install is an upgrade — leave it at 1 on every build and a phone will
      # not replace the app it already has. The run number only ever rises.
      - name: Set the version code
        id: version
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const code = Number(process.env.GITHUB_RUN_NUMBER);
            cfg.expo.android.versionCode = code;
            cfg.expo.ios.buildNumber = String(code);
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
            console.log('version ' + cfg.expo.version + ', build ' + code);
          "
          echo "value=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # android/ is generated, not committed, so it is rebuilt from app.json
      # every run and cannot drift from the config.
      #
      # No map key, deliberately. The map is MapLibre against OpenFreeMap's
      # tiles, which need no account and no card, so there is nothing here to
      # inject and nothing to leave out by accident.
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # A single APK carrying native code for every CPU is ~105 MB, most of
      # which any given phone throws away. Two changes cut that down:
      #
      #   1. Drop x86 and x86_64 — those are emulator architectures, not
      #      phones, so nothing real loses support.
      #   2. Split the rest per architecture, and keep a universal build as
      #      a fallback for anything unusual.
      #
      # The splits block is appended rather than edited into the middle of the
      # generated file: Gradle merges repeated `android { }` blocks, so this
      # cannot be broken by upstream template changes.
      - name: Build one APK per architecture
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' android/gradle.properties

          # Compress the native libraries inside the APK.
          #
          # Expo defaults this off, and off is right for the Play Store: an
          # uncompressed .so can be mapped straight out of the APK, which
          # makes a smaller *download* because Play recompresses the whole
          # thing on the way out and a smaller install because nothing is
          # extracted.
          #
          # Nothing about that applies here. This APK is downloaded directly
          # from a link on the site, so the file is the download, and
          # uncompressed native code is the single largest thing in it —
          # libhermes, libreactnative and MapLibre together. Turning
          # compression on costs a one-off extraction at install time and
          # nothing afterwards.
          sed -i 's/^expo.useLegacyPackaging=.*/expo.useLegacyPackaging=true/' android/gradle.properties

          # R8 shrinks and renames the Java and Kotlin side. It is off here
          # on purpose: an RN app that starts fine in debug and dies in
          # release is almost always R8 removing a class something reaches
          # for by name, and this APK is installed straight from a link with
          # no staged rollout to catch that. `proguard-rules.pro` below is
          # written and ready, so turning it on is this one line plus opening
          # the app once on a real phone.
          #
          #   sed -i 's/^android.enableMinifyInReleaseBuilds=.*/...=true/'
          cat >> android/gradle.properties <<'PROPS'
          android.enableMinifyInReleaseBuilds=false
          android.enableShrinkResourcesInReleaseBuilds=false
          PROPS

          # Kept whether or not minification is on, so the day it is turned
          # on the rules are already the ones that were reasoned about.
          #
          # Everything reached by reflection: Expo instantiates its modules
          # from names, and React Native's own rules ship inside its AAR.
          cat >> android/app/proguard-rules.pro <<'RULES'

          -keep class expo.modules.** { *; }
          -keep class app.nearby.directory.** { *; }
          -keep @expo.modules.core.interfaces.DoNotStrip class * { *; }
          -keepclassmembers class * { @expo.modules.core.interfaces.DoNotStrip *; }
          -keepclassmembers class * { @com.facebook.proguard.annotations.DoNotStrip *; }
          -keep class com.facebook.jni.** { *; }
          -dontwarn org.maplibre.**
          RULES

          grep -E '^expo.useLegacyPackaging|^android.enableMinify|^android.enableShrinkResources' android/gradle.properties

          # The generated project asks for 512 MB of metaspace. That is not
          # enough for this app: compileReleaseArtProfile dies with
          # OutOfMemoryError: Metaspace, and long before it does the JVM
          # spends most of its time collecting garbage — which is why a build
          # that should take fifteen minutes was taking forty and then
          # failing. The runner has 8 GB; give Gradle a real share of it.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -XX:+UseParallelGC/' android/gradle.properties
          grep -E '^org.gradle.jvmargs|^reactNativeArchitectures' android/gradle.properties
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              splits {
                  abi {
                      reset()
                      enable true
                      universalApk true
                      include "armeabi-v7a", "arm64-v8a"
                  }
              }
          }
          GRADLE
          grep '^reactNativeArchitectures' android/gradle.properties

      # android/ is generated, so the executable bit is not carried by git.
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      # nearby.apk is the 64-bit build and keeps the stable download URL,
      # because that is what almost every phone in use needs. The universal
      # build is published alongside it for older 32-bit devices.
      - name: Stage the assets
        run: |
          cd android/app/build/outputs/apk/release
          ls -la
          cp app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/nearby.apk"
          cp app-universal-release.apk "$GITHUB_WORKSPACE/nearby-universal.apk"
          cd "$GITHUB_WORKSPACE"
          echo "arm64:     $(du -h nearby.apk | cut -f1)"
          echo "universal: $(du -h nearby-universal.apk | cut -f1)"

      - name: Name this build
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.version.outputs.value }}-build.${{ steps.version.outputs.code }}" >> "$GITHUB_OUTPUT"
          fi

      # Keep the APKs even if publishing the release fails.
      - uses: actions/upload-artifact@v4
        with:
          name: nearby-apk
          path: |
            nearby.apk
            nearby-universal.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Nearby ${{ steps.meta.outputs.tag }}
          files: |
            nearby.apk
            nearby-universal.apk
          generate_release_notes: true
          body: |
            **Android APK — install it directly.**

            Most people want **`nearby.apk`** — the 64-bit build, which every
            Android phone from roughly 2016 onwards uses.

            If that one refuses to install, your phone is 32-bit only: take
            **`nearby-universal.apk`** instead. It is larger but runs anywhere.

            Open the file on your phone and allow installing from this source
            when Android asks. Play Protect may warn that the app is unknown,
            because it is not on the Play Store yet; choose **Install anyway**.

            Android 8 or newer. iPhone cannot install APKs.

            These builds are signed with the project's development key, which
            is fine for installing directly but is not the key the Play Store
            requires — Play Store releases go through `eas build`.
