name: Build Android APK

# Produces the APK the landing page links to.
#
#   - Run it by hand from the Actions tab to publish a build right now.
#   - Or push a tag like v1.0.1 to cut a versioned release.
#
# The asset is always named nearby.apk, which is what makes
# /releases/latest/download/nearby.apk a stable link the site can rely on.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Expo SDK 57 / React Native 0.86 builds against JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: version
        run: echo "value=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      # android/ is generated, not committed, so it is rebuilt from app.json
      # every run and cannot drift from the config.
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # A single APK carrying native code for every CPU is ~105 MB, most of
      # which any given phone throws away. Two changes cut that down:
      #
      #   1. Drop x86 and x86_64 — those are emulator architectures, not
      #      phones, so nothing real loses support.
      #   2. Split the rest per architecture, and keep a universal build as
      #      a fallback for anything unusual.
      #
      # The splits block is appended rather than edited into the middle of the
      # generated file: Gradle merges repeated `android { }` blocks, so this
      # cannot be broken by upstream template changes.
      - name: Build one APK per architecture
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' android/gradle.properties
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              splits {
                  abi {
                      reset()
                      enable true
                      universalApk true
                      include "armeabi-v7a", "arm64-v8a"
                  }
              }
          }
          GRADLE
          grep '^reactNativeArchitectures' android/gradle.properties

      # android/ is generated, so the executable bit is not carried by git.
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      # nearby.apk is the 64-bit build and keeps the stable download URL,
      # because that is what almost every phone in use needs. The universal
      # build is published alongside it for older 32-bit devices.
      - name: Stage the assets
        run: |
          cd android/app/build/outputs/apk/release
          ls -la
          cp app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/nearby.apk"
          cp app-universal-release.apk "$GITHUB_WORKSPACE/nearby-universal.apk"
          cd "$GITHUB_WORKSPACE"
          echo "arm64:     $(du -h nearby.apk | cut -f1)"
          echo "universal: $(du -h nearby-universal.apk | cut -f1)"

      - name: Name this build
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.version.outputs.value }}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Keep the APKs even if publishing the release fails.
      - uses: actions/upload-artifact@v4
        with:
          name: nearby-apk
          path: |
            nearby.apk
            nearby-universal.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Nearby ${{ steps.meta.outputs.tag }}
          files: |
            nearby.apk
            nearby-universal.apk
          generate_release_notes: true
          body: |
            **Android APK — install it directly.**

            Most people want **`nearby.apk`** — the 64-bit build, which every
            Android phone from roughly 2016 onwards uses.

            If that one refuses to install, your phone is 32-bit only: take
            **`nearby-universal.apk`** instead. It is larger but runs anywhere.

            Open the file on your phone and allow installing from this source
            when Android asks. Play Protect may warn that the app is unknown,
            because it is not on the Play Store yet; choose **Install anyway**.

            Android 8 or newer. iPhone cannot install APKs.

            These builds are signed with the project's development key, which
            is fine for installing directly but is not the key the Play Store
            requires — Play Store releases go through `eas build`.
